name: SolarX Monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may delay this a little)
  workflow_dispatch: {}       # lets you also trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          SM_USER: ${{ secrets.SM_USER }}
          SM_PASS: ${{ secrets.SM_PASS }}
          SM_COMPANY_KEY: ${{ secrets.SM_COMPANY_KEY }}
          SM_PN: ${{ secrets.SM_PN }}
          SM_SN: ${{ secrets.SM_SN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TUYA_ACCESS_ID: ${{ secrets.TUYA_ACCESS_ID }}
          TUYA_ACCESS_SECRET: ${{ secrets.TUYA_ACCESS_SECRET }}
          TUYA_DEVICE_ID: ${{ secrets.TUYA_DEVICE_ID }}
          TUYA_ENDPOINT: ${{ secrets.TUYA_ENDPOINT }}
        run: python monitor.py

      - name: Commit updated status.json
        run: |
          git config user.name "solarx-bot"
          git config user.email "solarx-bot@users.noreply.github.com"
          git add docs/status.json
          git diff --quiet --cached || git commit -m "update status"
          git push
