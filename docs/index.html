<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SolarX by Osman</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0f1115" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12181f; --slate:#5b6472; --mist:#96a0ab; --line:#e9ecf0;
    --paper:#f4f6f8; --card:#ffffff; --sidebar:#12151b;
    --grid-blue:#2f6fed; --grid-blue-soft:#dfe9fd;
    --solar-amber:#e08a1e; --solar-amber-soft:#fbe9cf;
    --batt-green:#1fa971; --batt-green-soft:#d9f2e6;
    --off:#c9cfd6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',-apple-system,sans-serif;min-height:100vh;}
  .app{display:flex;min-height:100vh;}
  .sidebar{width:76px;background:var(--sidebar);display:flex;flex-direction:column;align-items:center;padding:18px 0;flex-shrink:0;}
  .sidebar .logo{width:34px;height:34px;border-radius:8px;overflow:hidden;margin-bottom:26px;}
  .sidebar .logo img{width:100%;height:100%;object-fit:cover;}
  .navicon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#7c8592;margin-bottom:6px;}
  .navicon svg{width:19px;height:19px;}
  .navicon.active{background:linear-gradient(160deg,#e08a1e,#c96a12);color:#fff;box-shadow:0 6px 16px -4px rgba(224,138,30,.5);}
  main{flex:1;padding:22px 22px 50px;max-width:1000px;}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand img{width:38px;height:38px;border-radius:9px;object-fit:cover;}
  .brand .word{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:21px;letter-spacing:-0.01em;line-height:1;}
  .brand .word span{color:var(--solar-amber);}
  .brand .sub{font-size:10.5px;color:var(--mist);margin-top:3px;letter-spacing:.04em;}
  .status-pill{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;padding:9px 16px;border-radius:999px;display:flex;align-items:center;gap:7px;background:var(--ink);color:#fff;box-shadow:0 8px 20px -8px rgba(0,0,0,.35);}
  .status-pill .dot{width:7px;height:7px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 3px rgba(61,220,132,.25);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,24,40,.04);}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .card-head .eyebrow{font-size:10.5px;color:var(--mist);letter-spacing:.08em;text-transform:uppercase;font-weight:600;}
  .card-head h2{font-size:19px;margin:4px 0 0;font-family:'Space Grotesk',sans-serif;font-weight:600;}
  .live-badge{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--batt-green);font-weight:600;}
  .live-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--batt-green);animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .stage{position:relative;border-radius:18px;overflow:hidden;}
  .stage svg{display:block;width:100%;height:auto;}
  .node-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;fill:var(--slate);font-weight:600;letter-spacing:.03em;}
  .node-value{font-family:'IBM Plex Mono',monospace;font-size:12.5px;fill:var(--ink);font-weight:700;}
  .wire2{fill:none;stroke:transparent;stroke-width:5;stroke-linecap:round;}
  .wire2-active{stroke-dasharray:16 14;animation:dash2 0.9s linear infinite;}
  .wire2-active.grid-on{stroke:var(--grid-blue);}
  .wire2-active.solar-on{stroke:#f5b942;}
  .wire2-active.batt-on{stroke:var(--batt-green);}
  @keyframes dash2{ to{ stroke-dashoffset:-60; } }
  .dot-hidden{opacity:0;}
  .mini-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px;}
  .mini{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;}
  .mini .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .mini .ic svg{width:16px;height:16px;}
  .mini .k{font-size:10px;color:var(--mist);letter-spacing:.04em;text-transform:uppercase;}
  .mini .v{font-family:'IBM Plex Mono',monospace;font-size:14.5px;font-weight:700;margin-top:1px;}
  .ic-blue{background:var(--grid-blue-soft);color:var(--grid-blue);}
  .ic-amber{background:var(--solar-amber-soft);color:var(--solar-amber);}
  .ic-green{background:var(--batt-green-soft);color:var(--batt-green);}
  .eyebrow-block{font-size:10.5px;color:var(--mist);letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-bottom:12px;}
  .summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .sumcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;}
  .sumcard .top{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .sumcard .top .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;}
  .sumcard .top .ic svg{width:14px;height:14px;}
  .sumcard .lbl{font-size:10px;color:var(--mist);letter-spacing:.04em;text-transform:uppercase;font-weight:600;}
  .sumcard .big{font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:700;margin:4px 0 2px;}
  .sumcard .tag{font-size:11px;font-weight:600;}
  .tag-amber{color:var(--solar-amber);} .tag-green{color:var(--batt-green);} .tag-blue{color:var(--grid-blue);} .tag-mist{color:var(--mist);}
  .sumcard svg.spark{display:block;margin-top:10px;width:100%;height:36px;}
  .status-footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;}
  .status-footer .left{display:flex;align-items:center;gap:12px;}
  .status-footer .shield{width:40px;height:40px;border-radius:12px;background:var(--batt-green-soft);color:var(--batt-green);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .status-footer .shield svg{width:20px;height:20px;}
  .status-footer .title{font-weight:700;font-size:14.5px;}
  .status-footer .desc{font-size:12.5px;color:var(--mist);margin-top:2px;}
  .status-footer .right{text-align:right;}
  .status-footer .upd-lbl{font-size:10.5px;color:var(--mist);text-transform:uppercase;letter-spacing:.05em;}
  .status-footer .upd-val{font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;margin-top:2px;}
  .refresh-btn{margin-top:8px;background:var(--ink);color:#fff;border:none;padding:8px 18px;border-radius:999px;font-weight:600;font-size:12.5px;cursor:pointer;}
  @media (max-width:640px){
    .summary-grid{grid-template-columns:repeat(2,1fr);}
    .mini-row{grid-template-columns:repeat(2,1fr);}
    .sidebar{width:56px;} .navicon{width:38px;height:38px;}
    main{padding:16px 12px 40px;}
  }
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <div class="logo"><img src="logo.png" alt="SolarX"/></div>
    <div class="navicon active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></div>
    <div class="navicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></div>
    <div class="navicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="5" width="8" height="16" rx="1.5"/></svg></div>
    <div class="navicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg></div>
    <div class="navicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21V10l8-6 8 6v11"/><path d="M4 21h16"/></svg></div>
    <div class="navicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></div>
    <div class="navicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/></svg></div>
    <div class="navicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg></div>
  </nav>

  <main>
    <header>
      <div class="brand">
        <img src="logo.png" alt="SolarX logo"/>
        <div class="txt">
          <div class="word">Solar<span>X</span></div>
          <div class="sub">BY OSMAN &nbsp;·&nbsp; LIVE MONITOR</div>
        </div>
      </div>
      <div id="statusPill" class="status-pill"><span class="dot"></span><span id="pillText">Loading…</span></div>
    </header>

    <div class="card">
      <div class="card-head">
        <div><div class="eyebrow">System Overview</div><h2>Live Power Flow</h2></div>
        <div class="live-badge"><span class="dot"></span>Live</div>
      </div>

      <div class="stage">
        <div style="position:relative;width:100%;">
          <img src="house-scene-pv-off.png" alt="Solar house" id="imgPvOff" style="display:block;width:100%;height:auto;" />
          <img src="house-scene-pv-on.png" alt="Solar house PV active" id="imgPvOn" style="display:block;width:100%;height:auto;position:absolute;top:0;left:0;opacity:0;transition:opacity 0.6s ease;" />

          <!-- mode text box (fills the blank box drawn into the image, top-right) -->
          <div id="modeBox" style="position:absolute;left:64.8%;top:2.3%;width:31%;height:14.5%;display:flex;align-items:center;justify-content:center;">
            <span id="modeBoxText" style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(11px,2.6vw,22px);letter-spacing:.03em;color:#12181f;">—</span>
          </div>

          <svg id="overlaySvg" viewBox="0 0 1536 1024" style="position:absolute;top:0;left:0;width:100%;height:100%;" xmlns="http://www.w3.org/2000/svg">
            <!-- flow wire guides -->
            <path id="pathGrid" class="wire2" d="M183,365 L490,525 L775,660 L1080,705"/>
            <path id="pathSolar" class="wire2" d="M950,375 L775,660 L1080,705"/>
            <path id="pathBatt" class="wire2" d="M225,865 L775,660 L1080,705"/>

            <g id="dotsGrid" class="dot-hidden">
              <circle r="7" fill="var(--grid-blue)"><animateMotion dur="1.6s" repeatCount="indefinite" begin="0s" path="M183,365 L490,525 L775,660 L1080,705"/></circle>
              <circle r="7" fill="var(--grid-blue)"><animateMotion dur="1.6s" repeatCount="indefinite" begin="0.53s" path="M183,365 L490,525 L775,660 L1080,705"/></circle>
              <circle r="7" fill="var(--grid-blue)"><animateMotion dur="1.6s" repeatCount="indefinite" begin="1.06s" path="M183,365 L490,525 L775,660 L1080,705"/></circle>
            </g>
            <g id="dotsSolar" class="dot-hidden">
              <circle r="7" fill="#f5b942"><animateMotion dur="1.4s" repeatCount="indefinite" begin="0s" path="M950,375 L775,660 L1080,705"/></circle>
              <circle r="7" fill="#f5b942"><animateMotion dur="1.4s" repeatCount="indefinite" begin="0.47s" path="M950,375 L775,660 L1080,705"/></circle>
              <circle r="7" fill="#f5b942"><animateMotion dur="1.4s" repeatCount="indefinite" begin="0.94s" path="M950,375 L775,660 L1080,705"/></circle>
            </g>
            <g id="dotsBatt" class="dot-hidden">
              <circle r="7" fill="var(--batt-green)"><animateMotion dur="1.5s" repeatCount="indefinite" begin="0s" path="M225,865 L775,660 L1080,705"/></circle>
              <circle r="7" fill="var(--batt-green)"><animateMotion dur="1.5s" repeatCount="indefinite" begin="0.5s" path="M225,865 L775,660 L1080,705"/></circle>
              <circle r="7" fill="var(--batt-green)"><animateMotion dur="1.5s" repeatCount="indefinite" begin="1s" path="M225,865 L775,660 L1080,705"/></circle>
            </g>
          </svg>
        </div>
      </div>

      <div class="mini-row">
        <div class="mini"><div class="ic ic-blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 12h4l2-6 4 12 2-6h4"/></svg></div><div><div class="k">Mode</div><div class="v" id="statMode">—</div></div></div>
        <div class="mini"><div class="ic ic-green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="6" y="3" width="10" height="18" rx="2"/></svg></div><div><div class="k">Battery</div><div class="v" id="statBatt">—</div></div></div>
        <div class="mini"><div class="ic ic-amber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/></svg></div><div><div class="k">Load</div><div class="v" id="statLoad">—</div></div></div>
        <div class="mini"><div class="ic ic-blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 21V10l8-6 8 6v11"/></svg></div><div><div class="k">Grid Voltage</div><div class="v" id="statGridV">—</div></div></div>
      </div>
    </div>

    <div class="eyebrow-block">Power Summary</div>
    <div class="summary-grid">
      <div class="sumcard">
        <div class="top"><div class="ic ic-amber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/></svg></div><div class="lbl">Solar Power</div></div>
        <div class="big" id="sumSolar">—</div><div class="tag tag-amber" id="sumSolarTag">—</div>
        <svg class="spark" viewBox="0 0 200 40" preserveAspectRatio="none"><polyline id="sparkSolar" fill="none" stroke="var(--solar-amber)" stroke-width="2.5" points=""/></svg>
      </div>
      <div class="sumcard">
        <div class="top"><div class="ic ic-green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="6" y="3" width="10" height="18" rx="2"/></svg></div><div class="lbl">Battery Status</div></div>
        <div class="big" id="sumBatt">—</div><div class="tag tag-green" id="sumBattTag">—</div>
        <svg class="spark" viewBox="0 0 200 40" preserveAspectRatio="none"><polyline id="sparkBatt" fill="none" stroke="var(--batt-green)" stroke-width="2.5" points=""/></svg>
      </div>
      <div class="sumcard">
        <div class="top"><div class="ic ic-amber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/></svg></div><div class="lbl">Load Power</div></div>
        <div class="big" id="sumLoad">—</div><div class="tag tag-mist" id="sumLoadTag">—</div>
        <svg class="spark" viewBox="0 0 200 40" preserveAspectRatio="none"><polyline id="sparkLoad" fill="none" stroke="var(--solar-amber)" stroke-width="2.5" points=""/></svg>
      </div>
      <div class="sumcard">
        <div class="top"><div class="ic ic-blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 21V10l8-6 8 6v11"/></svg></div><div class="lbl">Grid Voltage</div></div>
        <div class="big" id="sumGridV">—</div><div class="tag tag-blue" id="sumGridTag">—</div>
        <svg class="spark" viewBox="0 0 200 40" preserveAspectRatio="none"><polyline id="sparkGrid" fill="none" stroke="var(--grid-blue)" stroke-width="2.5" points=""/></svg>
      </div>
    </div>

    <div class="card status-footer">
      <div class="left">
        <div class="shield"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/><path d="M9 12l2 2 4-4"/></svg></div>
        <div><div class="title" id="footTitle">Checking system…</div><div class="desc" id="footDesc">Fetching the latest reading.</div></div>
      </div>
      <div class="right">
        <div class="upd-lbl">Last Updated</div>
        <div class="upd-val" id="updatedAt">—</div>
        <button class="refresh-btn" onclick="loadStatus()">↻ Refresh Now</button>
      </div>
    </div>
  </main>
</div>

<script>
// Cloudflare Worker status endpoint
const STATUS_URL = 'https://sparkling-sun-c83c.mrosmanshahbaz.workers.dev/status';

function sparkPoints(seed, amp){
  let pts = [];
  for(let i=0;i<12;i++){
    const n = Math.sin(i*0.9 + seed) * amp + amp;
    pts.push((i*(200/11)).toFixed(1) + ',' + (36 - n).toFixed(1));
  }
  return pts.join(' ');
}

async function loadStatus(){
  try{
    const res = await fetch(STATUS_URL + '?t=' + Date.now());
    const data = await res.json();
    render(data);
  }catch(e){
    document.getElementById('pillText').textContent = 'Offline';
    document.getElementById('footTitle').textContent = 'Could not load status';
    document.getElementById('footDesc').textContent = 'Check back after the next automatic run.';
  }
}

function setActive(pathId, dotsId, on, activeClass){
  document.getElementById(pathId).classList.toggle('wire2-active', on);
  document.getElementById(pathId).classList.toggle(activeClass, on);
  document.getElementById(dotsId).classList.toggle('dot-hidden', !on);
}

function render(data){
  const reading = data.reading || {};
  const mode = (data.mode_value || '').toLowerCase();
  const isLine = mode.includes('line') || mode.includes('grid');
  const isBatt = mode.includes('batt') || mode.includes('inv');
  const pv1v = parseFloat(reading['PV1 Input Voltage']) || 0;
  const solarActive = pv1v > 5;
  const pvPowerW = parseFloat(reading['PV1 Charging Power']) || 0;
  const gridV = reading['Grid Voltage'] || '—';
  const battPct = parseFloat(data.battery_value) || 0;

  document.getElementById('pillText').textContent = data.mode_value || 'Unknown';

  setActive('pathGrid', 'dotsGrid', isLine, 'grid-on');
  setActive('pathSolar', 'dotsSolar', solarActive, 'solar-on');
  setActive('pathBatt', 'dotsBatt', isBatt, 'batt-on');

  // crossfade between the two house images based on solar production
  document.getElementById('imgPvOn').style.opacity = solarActive ? '1' : '0';

  // mode text box (drawn into the top-right blank box in the image)
  const modeText = document.getElementById('modeBoxText');
  modeText.textContent = (data.mode_value || 'Unknown').toUpperCase();
  modeText.style.color = isBatt ? '#1fa971' : (isLine ? '#2f6fed' : '#5b6472');

  document.getElementById('statMode').textContent = data.mode_value || '—';
  document.getElementById('statBatt').textContent = data.battery_value || '—';
  document.getElementById('statLoad').textContent = reading['Output Load Percent'] || '—';
  document.getElementById('statGridV').textContent = gridV;

  document.getElementById('sumSolar').textContent = (pvPowerW/1000).toFixed(2) + ' kW';
  document.getElementById('sumSolarTag').textContent = pvPowerW > 0 ? 'Generating' : 'Idle';
  document.getElementById('sumBatt').textContent = data.battery_value || '—';
  document.getElementById('sumBattTag').textContent = battPct >= 99 ? 'Fully Charged' : (isBatt ? 'Discharging' : 'Charging');
  document.getElementById('sumLoad').textContent = (reading['Output Load Percent'] || '—');
  document.getElementById('sumLoadTag').textContent = reading['AC Output Active Power'] ? ('~ ' + reading['AC Output Active Power']) : '';
  document.getElementById('sumGridV').textContent = gridV;
  document.getElementById('sumGridTag').textContent = isLine ? 'Normal' : 'On Battery';

  document.getElementById('sparkSolar').setAttribute('points', sparkPoints(pvPowerW/300, 10));
  document.getElementById('sparkBatt').setAttribute('points', sparkPoints(battPct/10, 8));
  document.getElementById('sparkLoad').setAttribute('points', sparkPoints((parseFloat(reading['Output Load Percent'])||0)/5, 9));
  document.getElementById('sparkGrid').setAttribute('points', sparkPoints((parseFloat(gridV)||230)/20, 7));

  document.getElementById('footTitle').textContent = 'Everything is running perfectly.';
  document.getElementById('footDesc').textContent = 'All systems operational and performing within normal range.';
  document.getElementById('updatedAt').textContent = data.updated_at || '—';
}

loadStatus();
setInterval(loadStatus, 60000);
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
