<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SolarX by Osman</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#ffffff" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12181f;
    --slate:#4b5768;
    --mist:#8b96a3;
    --line:#e7ebef;
    --paper:#ffffff;
    --panel:#f6f8fa;
    --grid-blue:#2563eb;
    --grid-blue-soft:#dbe6fd;
    --solar-amber:#d97706;
    --solar-amber-soft:#fbe6c8;
    --batt-green:#059669;
    --batt-green-soft:#d7f0e6;
    --off:#c7cdd4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',-apple-system,sans-serif;
    min-height:100vh;
    padding:20px 16px 48px;
  }
  .wrap{max-width:520px;margin:0 auto;}

  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .brand{display:flex;flex-direction:column;line-height:1.05;}
  .brand .word{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:-0.01em;
  }
  .brand .word span{color:var(--solar-amber);}
  .brand .sub{font-size:11px;color:var(--mist);margin-top:2px;letter-spacing:.03em;}

  .status-pill{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    font-weight:600;
    padding:7px 12px;
    border-radius:999px;
    letter-spacing:.02em;
    display:flex;align-items:center;gap:6px;
  }
  .status-pill .dot{width:6px;height:6px;border-radius:50%;}
  .status-line{background:var(--grid-blue-soft);color:var(--grid-blue);}
  .status-line .dot{background:var(--grid-blue);}
  .status-batt{background:var(--batt-green-soft);color:var(--batt-green);}
  .status-batt .dot{background:var(--batt-green);}
  .status-unknown{background:var(--panel);color:var(--mist);}
  .status-unknown .dot{background:var(--off);}

  .stage{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:20px;
    padding:8px 4px 4px;
    margin-bottom:14px;
    overflow:hidden;
  }
  .stage svg{display:block;width:100%;height:auto;}

  .flow{fill:none;stroke-width:2.5;stroke-linecap:round;}
  .flow-off{stroke:var(--off);opacity:.55;}
  .flow-on{stroke-dasharray:7 7;animation:dash 0.9s linear infinite;}
  .flow-grid.flow-on{stroke:var(--grid-blue);}
  .flow-solar.flow-on{stroke:var(--solar-amber);}
  .flow-batt.flow-on{stroke:var(--batt-green);}
  @keyframes dash{ to{ stroke-dashoffset:-28; } }

  .node-label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;fill:var(--slate);font-weight:500;}
  .node-value{font-family:'IBM Plex Mono',monospace;font-size:11px;fill:var(--ink);font-weight:600;}

  .grid-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:13px 14px;}
  .stat .k{font-size:10.5px;color:var(--mist);letter-spacing:.02em;text-transform:uppercase;}
  .stat .v{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;color:var(--ink);margin-top:3px;}

  .updated{text-align:center;color:var(--mist);font-size:11.5px;margin-top:16px;font-family:'IBM Plex Mono',monospace;}
  .refresh-btn{display:block;margin:14px auto 0;background:var(--ink);color:#fff;border:none;padding:10px 26px;border-radius:999px;font-weight:600;font-size:13px;font-family:'Inter',sans-serif;}
  .loading{text-align:center;color:var(--mist);padding:50px 0;font-size:13px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="word">Solar<span>X</span></div>
      <div class="sub">BY OSMAN &nbsp;·&nbsp; LIVE MONITOR</div>
    </div>
    <div id="statusPill" class="status-pill status-unknown"><span class="dot"></span>—</div>
  </header>

  <div class="stage">
    <svg viewBox="0 0 460 300" xmlns="http://www.w3.org/2000/svg">
      <line x1="10" y1="240" x2="450" y2="240" stroke="#dfe4e9" stroke-width="1.5"/>

      <circle cx="230" cy="42" r="15" fill="var(--solar-amber-soft)" stroke="var(--solar-amber)" stroke-width="1.5"/>
      <g stroke="var(--solar-amber)" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
        <line x1="230" y1="18" x2="230" y2="10"/>
        <line x1="230" y1="66" x2="230" y2="74"/>
        <line x1="206" y1="42" x2="198" y2="42"/>
        <line x1="254" y1="42" x2="262" y2="42"/>
        <line x1="213" y1="25" x2="207" y2="19"/>
        <line x1="247" y1="25" x2="253" y2="19"/>
      </g>

      <g>
        <polygon points="150,120 230,72 310,120" fill="#eef1f4" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>
        <g stroke="var(--solar-amber)" stroke-width="1" opacity="0.85">
          <polygon points="163,113 197,113 205,100 175,100" fill="var(--solar-amber-soft)"/>
          <polygon points="200,98 228,98 231,84 205,84" fill="var(--solar-amber-soft)"/>
          <polygon points="232,84 258,98 288,98 260,84" fill="var(--solar-amber-soft)"/>
          <polygon points="262,100 293,113 328,113 295,100" fill="var(--solar-amber-soft)"/>
          <line x1="180" y1="100" x2="188" y2="113"/>
          <line x1="215" y1="84" x2="212" y2="98"/>
          <line x1="248" y1="84" x2="252" y2="98"/>
          <line x1="280" y1="100" x2="272" y2="113"/>
        </g>

        <rect x="160" y="120" width="140" height="90" fill="#fbfcfd" stroke="var(--ink)" stroke-width="2"/>
        <rect x="215" y="168" width="30" height="42" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.5"/>
        <rect x="175" y="140" width="24" height="22" fill="var(--grid-blue-soft)" stroke="var(--ink)" stroke-width="1.2"/>
        <rect x="261" y="140" width="24" height="22" fill="var(--grid-blue-soft)" stroke="var(--ink)" stroke-width="1.2"/>
      </g>

      <g>
        <line x1="55" y1="240" x2="55" y2="150" stroke="var(--ink)" stroke-width="3"/>
        <line x1="35" y1="160" x2="75" y2="160" stroke="var(--ink)" stroke-width="3"/>
        <line x1="42" y1="160" x2="42" y2="150" stroke="var(--ink)" stroke-width="2"/>
        <line x1="68" y1="160" x2="68" y2="150" stroke="var(--ink)" stroke-width="2"/>
        <text x="55" y="262" text-anchor="middle" class="node-label">GRID</text>
      </g>

      <g>
        <rect x="380" y="170" width="46" height="60" rx="6" fill="var(--batt-green-soft)" stroke="var(--batt-green)" stroke-width="2"/>
        <rect x="394" y="160" width="18" height="10" rx="2" fill="var(--batt-green-soft)" stroke="var(--batt-green)" stroke-width="2"/>
        <rect id="battFillRect" x="386" y="222" width="34" height="0" fill="var(--batt-green)"/>
        <text x="403" y="262" text-anchor="middle" class="node-label">BATTERY</text>
        <text id="battPctText" x="403" y="204" text-anchor="middle" class="node-value" font-size="12">—</text>
      </g>

      <path id="flowGrid" class="flow flow-grid flow-off" d="M55,150 L55,180 L155,180"/>
      <path id="flowSolar" class="flow flow-solar flow-off" d="M230,74 L230,132"/>
      <path id="flowBatt" class="flow flow-batt flow-off" d="M380,195 L305,195"/>
    </svg>
  </div>

  <div id="statGrid" class="grid-stats">
    <div class="stat"><div class="k">Mode</div><div class="v" id="statMode">—</div></div>
    <div class="stat"><div class="k">Battery</div><div class="v" id="statBatt">—</div></div>
    <div class="stat"><div class="k">Load</div><div class="v" id="statLoad">—</div></div>
    <div class="stat"><div class="k">Grid Voltage</div><div class="v" id="statGridV">—</div></div>
  </div>

  <div class="updated" id="updatedAt">—</div>
  <button class="refresh-btn" onclick="loadStatus()">Refresh</button>
</div>

<script>
async function loadStatus(){
  try{
    const res = await fetch('status.json?t=' + Date.now());
    const data = await res.json();
    render(data);
  }catch(e){
    document.getElementById('updatedAt').textContent = 'Could not load status yet.';
  }
}

function setFlow(id, on){
  const el = document.getElementById(id);
  el.classList.toggle('flow-on', on);
  el.classList.toggle('flow-off', !on);
}

function render(data){
  const reading = data.reading || {};
  const mode = (data.mode_value || '').toLowerCase();
  const isLine = mode.includes('line') || mode.includes('grid');
  const isBatt = mode.includes('batt') || mode.includes('inv');

  const pv1v = parseFloat(reading['PV1 Input Voltage']) || 0;
  const solarActive = pv1v > 5;

  const pill = document.getElementById('statusPill');
  pill.className = 'status-pill ' + (isLine ? 'status-line' : (isBatt ? 'status-batt' : 'status-unknown'));
  pill.innerHTML = '<span class="dot"></span>' + (data.mode_value || 'Unknown');

  setFlow('flowGrid', isLine);
  setFlow('flowBatt', isBatt);
  setFlow('flowSolar', solarActive);

  const battPct = parseFloat(data.battery_value) || 0;
  const rect = document.getElementById('battFillRect');
  const maxH = 52;
  const h = Math.max(0, Math.min(maxH, (battPct/100) * maxH));
  rect.setAttribute('height', h);
  rect.setAttribute('y', 222 - h);
  document.getElementById('battPctText').textContent = data.battery_value || '—';

  document.getElementById('statMode').textContent = data.mode_value || '—';
  document.getElementById('statBatt').textContent = data.battery_value || '—';
  document.getElementById('statLoad').textContent = reading['Output Load Percent'] || '—';
  document.getElementById('statGridV').textContent = reading['Grid Voltage'] || '—';

  document.getElementById('updatedAt').textContent = 'Last updated: ' + (data.updated_at || '—');
}

loadStatus();
setInterval(loadStatus, 60000);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
